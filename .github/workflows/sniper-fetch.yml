name: FPL Sniper Data Fetch

permissions:
  contents: write

on:
  schedule:
    # Runs at the top of every hour
    - cron: '0 * * * *'
  workflow_dispatch:
    # Allows you to trigger it manually from the GitHub UI for testing

jobs:
  snipe:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          persist-credentials: true
          fetch-depth: 0
        
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install chromium
        
      - name: Check FPL Deadline (Sniper Window)
        id: sniper
        # This will exit with 1 if it's not the right time, failing this step.
        # We use continue-on-error so the workflow just stops gracefully instead of sending you a massive "FAILURE" email every hour.
        continue-on-error: true
        run: npx tsx scripts/check-deadline.ts
        
      # The subsequent steps only run if the sniper step exited with 0 (SUCCESS)
      - name: Fetch FPLForm Data
        if: steps.sniper.outcome == 'success'
        run: npx tsx scripts/fetch-xp.ts

      - name: Fetch Top 1k Manager Sentiment
        if: steps.sniper.outcome == 'success'
        run: npx tsx scripts/fetch-top-1k.ts

      - name: Commit and Push New Data
        if: steps.sniper.outcome == 'success'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fplform.csv data/top_1000_eo.json
          git diff --staged --quiet || git commit -m "Auto-update: Scraped latest FPLForm predictions and Top 1k EO 2 hours before deadline [skip ci]"
          git pull --rebase origin main
          git push
